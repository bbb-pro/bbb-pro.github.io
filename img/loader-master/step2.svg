<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="24" y="40" fill="#0f172a" font-size="20" font-weight="700">② 添加并配置货物</text>
  <text x="24" y="64" fill="#64748b" font-size="14">点击「＋ 添加货物」新增卡片，逐项填写，支持托盘打托</text>

  <!-- 货物卡片 -->
  <rect x="24" y="88" width="600" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="24" y="88" width="600" height="44" rx="12" fill="#0ea5e9"/>
  <text x="44" y="116" fill="#fff" font-size="15" font-weight="700">货物 1 · A款礼盒</text>
  <rect x="556" y="100" width="48" height="22" rx="11" fill="#fff"/>
  <text x="566" y="115" fill="#0369a1" font-size="11">托盘 ✓</text>

  <g font-size="13" fill="#334155">
    <!-- 左列 -->
    <text x="44" y="150" fill="#0f172a" font-weight="700">基础信息</text>
    <text x="44" y="178">名称</text>
    <rect x="44" y="186" width="248" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="56" y="207" fill="#64748b" font-size="12">A款礼盒</text>
    <text x="44" y="244">长 / 宽 / 高 (mm)</text>
    <rect x="44" y="252" width="76" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="58" y="273" fill="#64748b" font-size="12">400</text>
    <rect x="128" y="252" width="76" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="142" y="273" fill="#64748b" font-size="12">300</text>
    <rect x="212" y="252" width="80" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="228" y="273" fill="#64748b" font-size="12">250</text>
    <text x="44" y="308">单重 (kg)</text>
    <rect x="44" y="316" width="120" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="58" y="337" fill="#64748b" font-size="12">15</text>
    <text x="44" y="372">数量</text>
    <rect x="44" y="380" width="120" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="58" y="401" fill="#64748b" font-size="12">120</text>
    <text x="44" y="430">最大上层承重 (kg)</text>
    <rect x="44" y="438" width="120" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="58" y="459" fill="#64748b" font-size="12">60</text>

    <!-- 右列 -->
    <text x="320" y="150" fill="#0f172a" font-weight="700">摆放选项</text>
    <rect x="320" y="166" width="18" height="18" rx="4" fill="#0ea5e9"/><text x="346" y="180">允许旋转（交换长/宽）</text>
    <rect x="320" y="196" width="18" height="18" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="346" y="210">允许倒置</text>
    <text x="320" y="246">优先级</text>
    <rect x="320" y="254" width="60" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="338" y="274" fill="#64748b" font-size="12">1</text>
    <text x="392" y="274" fill="#64748b" font-size="11">1优先(里底)/2默认/3靠门</text>
    <text x="320" y="306">分组</text>
    <rect x="320" y="314" width="120" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="334" y="334" fill="#64748b" font-size="12">G-A</text>

    <!-- 托盘区 -->
    <text x="320" y="372" fill="#0f172a" font-weight="700">托盘（勾选后）</text>
    <text x="320" y="396">托盘长/宽 (mm)</text>
    <rect x="320" y="404" width="78" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="334" y="424" fill="#64748b" font-size="12">1200</text>
    <rect x="406" y="404" width="78" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="420" y="424" fill="#64748b" font-size="12">1000</text>
    <text x="320" y="448">每托数量 / 托盘高(mm)</text>
    <rect x="320" y="456" width="60" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="332" y="476" fill="#64748b" font-size="12">12</text>
    <rect x="388" y="456" width="60" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="400" y="476" fill="#64748b" font-size="12">150</text>
  </g>

  <!-- 右侧：理论容量估算 + 打托预览占位 -->
  <rect x="648" y="88" width="328" height="180" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="668" y="116" fill="#1d4ed8" font-size="15" font-weight="700">💡 当前柜型理论容量</text>
  <text x="668" y="146" fill="#334155" font-size="13">40HQ 最多可放 <tspan fill="#0369a1" font-weight="700">520</tspan> 件</text>
  <text x="668" y="172" fill="#334155" font-size="13">整托高度约 <tspan fill="#0369a1" font-weight="700">900</tspan> mm</text>
  <text x="668" y="206" fill="#64748b" font-size="12">发货前快速判断柜容是否够用</text>
  <text x="668" y="230" fill="#64748b" font-size="12">填入尺寸即实时估算，无需先算</text>

  <rect x="648" y="288" width="328" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="668" y="316" fill="#0f172a" font-size="15" font-weight="700">打托方案（俯视预览）</text>
  <g transform="translate(668,340)">
    <rect x="0" y="0" width="150" height="120" rx="4" fill="#fff" stroke="#94a3b8"/>
    <g fill="#38bdf8">
      <rect x="8" y="8" width="40" height="30" rx="2"/><rect x="54" y="8" width="40" height="30" rx="2"/><rect x="100" y="8" width="40" height="30" rx="2"/>
      <rect x="8" y="44" width="40" height="30" rx="2"/><rect x="54" y="44" width="40" height="30" rx="2"/><rect x="100" y="44" width="40" height="30" rx="2"/>
      <rect x="8" y="80" width="40" height="30" rx="2"/><rect x="54" y="80" width="40" height="30" rx="2"/><rect x="100" y="80" width="40" height="30" rx="2"/>
    </g>
  </g>
  <text x="836" y="356" fill="#334155" font-size="12">每托 12 箱</text>
  <text x="836" y="378" fill="#334155" font-size="12">3 层交错</text>
  <text x="836" y="400" fill="#334155" font-size="12">整托高 900mm</text>

  <rect x="24" y="492" width="180" height="40" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="58" y="518" fill="#0369a1" font-size="14" font-weight="700">＋ 添加货物</text>
  <text x="220" y="518" fill="#64748b" font-size="13">可添加多种货物，分别设优先级/分组</text>
</svg>
